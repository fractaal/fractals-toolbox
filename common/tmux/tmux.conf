# Enable mouse support
set -g mouse on

set-window-option -g mode-keys vi

# Extended keys: let inner apps (neovim, emacs, ...) distinguish key presses
# that legacy ASCII collapses together -- Ctrl+I vs Tab, Ctrl+[ vs Esc,
# Ctrl+Shift+x vs Ctrl+x, Shift+Enter, etc.
# 'on' is opt-in: tmux only sends extended sequences to apps that request them,
# so non-requesting apps (shells, this session) see no change. Use 'always' to
# force it on every app. Reporting format is 'xterm' (modifyOtherKeys) by
# default; switch to csi-u with `set -s extended-keys-format csi-u` if an app
# wants the kitty/CSI-u form.
# The outer terminal must advertise the extkeys feature for tmux to request
# extended keys from it -- kitty (xterm-kitty) supports the protocol.
set -s extended-keys on
set -as terminal-features 'xterm-kitty:extkeys'

set -g pane-border-lines double

# Pane border labels
set -g pane-border-status top
set -g pane-border-format " #P: #{pane_title} | #{pane_current_command} "

# Ctrl+b T to rename current pane title (like Ctrl+b , for windows)
bind T command-prompt -p "Pane title:" "select-pane -T '%%'"

# Forward pane title(s) to outer terminal (e.g. kitty tab bar).
# Single pane: show its title as-is. Multi-pane: concat each pane's title.
set -g set-titles on
set -g set-titles-string "#{?#{==:#{window_panes},1},#{pane_title},#{P:[#{pane_title}] }}"

# Garbage-collect detached disposable term-* sessions when they are only an idle shell.
# This keeps long-running detached sessions safe but cleans up terminals closed at a prompt.
set-hook -g client-detached 'run-shell -b "$HOME/.fractals-toolbox/common/bin/tmux-prune-idle-sessions --delay 60"'
set-hook -g client-session-changed 'run-shell -b "$HOME/.fractals-toolbox/common/bin/tmux-prune-idle-sessions --delay 60"'
